name: Deploy to Firebase

on:
  push:
    branches:
      - main
    # CI/instruction-only changes do not rebuild Cloud Run or Hosting.
    paths-ignore:
      - '.github/**'
      - 'CLAUDE.md'
  # Use explicitly for deployment-workflow changes that need a live redeploy.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    # Manual deployment must use reviewed main, never an arbitrary branch.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect gateway source changes
        id: gateway_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: bash .github/scripts/gateway-changes.sh

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        if: steps.gateway_changes.outputs.changed == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy Kyber kiosk gateway
        if: steps.gateway_changes.outputs.changed == 'true'
        run: |
          gcloud run deploy voget-io-kyber-gateway \
            --project kinetic-object-322814 \
            --region us-central1 \
            --source gateway \
            --allow-unauthenticated \
            --max-instances 1 \
            --service-account voget-kiosk-gateway@kinetic-object-322814.iam.gserviceaccount.com \
            --set-env-vars "KYBER_URL=https://kyber-falcon.voget.io,KYBER_AGENT_NAME=glyph,KYBER_KIOSK_HARNESS=codex,REQUEST_DEADLINE_MS=30000,MAX_QUEUE_DEPTH=4,ALLOWED_ORIGINS=https://voget.io,ALLOWED_PREVIEW_HOST_PREFIX=voget-io--,ALLOWED_PREVIEW_HOST_SUFFIXES=web.app|firebaseapp.com" \
            --set-secrets KYBER_API_KEY=KYBER_KIOSK_API_KEY:latest \
            --quiet

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: kinetic-object-322814
          target: voget-io
          channelId: live
