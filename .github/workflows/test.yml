name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Sol/bot PRs avoid persistent cache storage; tests still run.
          cache: ${{ !startsWith(github.head_ref, 'security/sol-') && github.event.pull_request.user.login != 'dependabot[bot]' && 'npm' || '' }}

      - name: Test deployment change guard
        run: node --test .github/scripts/gateway-changes.test.mjs

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run unit tests
        run: npm run test:run

      - name: Test Kyber kiosk gateway
        working-directory: gateway
        run: npm test

      - name: Pressure-test Kyber kiosk gateway limits
        working-directory: gateway
        run: npm run load-test

  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          # Sol/bot PRs avoid persistent cache storage; tests still run.
          cache: ${{ !startsWith(github.head_ref, 'security/sol-') && github.event.pull_request.user.login != 'dependabot[bot]' && 'npm' || '' }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e -- --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && !startsWith(github.head_ref, 'security/sol-') && github.event.pull_request.user.login != 'dependabot[bot]' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
